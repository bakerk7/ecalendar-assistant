[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecalendar-assistant"
version = "0.2.0"
description = "Claude Code skill and Python client for the eCalendar / Dragon Touch family calendar private API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
images = ["Pillow"]

[tool.setuptools]
py-modules = ["ecal", "ecal_cache", "extract_ecal_config"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
# Docstrings and captured request samples are long on purpose.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
