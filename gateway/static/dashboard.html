<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baker Family</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Inter","Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f1ec;color:#1f2933;display:flex;flex-direction:column;padding:1.4vw 1.6vw;overflow:hidden;font-size:12px;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* ---------- header */
.top{flex:0 0 auto;min-height:6.2vw;display:flex;align-items:center;padding:0 .4vw}
.time{white-space:nowrap;font-size:3.9vw;font-weight:300;letter-spacing:-.15vw;line-height:1;font-variant-numeric:tabular-nums;color:#1f2933}
.date{font-size:1.45vw;color:#6b7280;font-weight:500;line-height:1.25;max-width:19vw}
.wx{margin-left:auto;font-size:1.5vw;display:flex;align-items:center;background:#fff;border-radius:1.2vw;padding:.6vw 1.2vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wx .ic{font-size:2.6vw;line-height:1}.wx b{font-size:2vw;font-weight:600}
.wx .hl{color:#6b7280;font-size:1.15vw;white-space:nowrap}.wx span{white-space:nowrap}
.hchips{display:flex;align-items:center;min-width:0}.hchips:empty{display:none}
.hc{display:flex;align-items:center;font-size:1vw;font-weight:600;padding:.45vw .9vw;border-radius:2vw;white-space:nowrap;background:#e3efe6;color:#2f6b45}
.hc.warn{background:#fbecd2;color:#8a5a12;border:.12vw solid #e7b25c}.hc.info{background:#ebe7e0;color:#57534e}
.addb{flex:none;border:0;background:#1f2933;color:#fff;font-weight:700;font-size:1.45vw;padding:.9vw 1.9vw;border-radius:3vw;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);min-height:4.2vw;letter-spacing:.02vw}
.addb:active{-webkit-transform:scale(.97);transform:scale(.97)}
/* ---------- layout */
.main{flex:1;display:flex;min-height:0}
.cal{flex:1;min-width:0;background:#fff;border-radius:1.6vw;padding:1.3vw 1.4vw 1.4vw;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center}
.bar h2{font-size:1.6vw;font-weight:700;margin-right:auto;white-space:nowrap;letter-spacing:-.02vw}
.nav{font-size:1.6vw;background:#f4f1ec;border:0;border-radius:50%;width:2.7vw;height:2.7vw;cursor:pointer;color:#374151;line-height:1}
.nav.tb{width:auto;border-radius:3vw;padding:0 1.1vw;font-size:1vw;font-weight:700}
.tg{display:flex;background:#f4f1ec;border-radius:3vw;padding:.3vw}
.tg button{border:0;background:none;padding:.6vw 1.1vw;font-size:1.05vw;border-radius:3vw;font-weight:600;color:#6b7280;cursor:pointer}
.tg .on{background:#fff;color:#1f2933;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pfs{display:flex;flex-wrap:nowrap;min-width:0;overflow:hidden}.bar .nav,.bar .tg{flex:none}
.pf{display:flex;align-items:center;font-size:.9vw;font-weight:600;background:none;border-radius:2vw;padding:.2vw .5vw .2vw .2vw;white-space:nowrap;border:0;cursor:pointer;color:#374151}
.pf i{width:1.8vw;height:1.8vw;border-radius:50%;color:#fff;font-style:normal;font-weight:700;display:-webkit-box;display:flex;align-items:center;justify-content:center;font-size:1vw}
.pf.off{opacity:.3}
/* ---------- grid */
.grid{flex:1;display:grid;grid-gap:.8vw;gap:.8vw;min-height:0}
.week{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.day{background:#faf8f5;border-radius:1.1vw;padding:.8vw .8vw .7vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.today{background:#fff;border:.18vw solid #1f2933}
.dh{display:flex;align-items:baseline;font-size:1.05vw;color:#6b7280;padding:0 .2vw;font-weight:600;text-transform:uppercase;letter-spacing:.06vw}
.dh>span:first-child{-webkit-box-ordinal-group:2;order:1}
.dh strong{-webkit-box-ordinal-group:1;order:0;font-size:2.3vw;color:#1f2933;font-weight:700;letter-spacing:-.05vw;margin-right:.5vw;line-height:1}
.dh .dw{-webkit-box-ordinal-group:3;order:2;font-size:1vw;color:#6b7280;margin-left:auto;white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:500}
.today .dh strong{background:#1f2933;color:#fff;border-radius:.7vw;padding:.15vw .55vw .25vw}
.today .dh>span:first-child::after{content:' · Today';color:#1f2933}
.evs{display:flex;flex-direction:column;overflow-y:auto;min-height:0;scrollbar-width:none}
.ev{background:#fff;border-left:.4vw solid var(--c);border-radius:.6vw;padding:.55vw .7vw;font-size:1.1vw;line-height:1.28;word-break:break-word;font-weight:600;color:#1f2933;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ev b{margin-right:.3vw;font-size:1vw;font-weight:700;color:var(--c);letter-spacing:.02vw}
.ev.ad{background:var(--c);color:#fff;border-left-color:transparent;padding:.45vw .7vw;box-shadow:none}
.ev .who{font-size:.8vw;font-weight:500;opacity:.6;display:block;margin-top:.1vw}
.ev.ad .who{opacity:.85}
.day.sum{background:#fff;border:.14vw solid #e8e3db}
.sum .dh strong{font-size:2.3vw}
.sum .row{display:flex;align-items:center;font-size:1.1vw;color:#374151;padding:.25vw .2vw;font-weight:600}
.sum .row i{width:1vw;height:1vw;border-radius:50%;flex:none}.sum .row b{margin-left:auto;font-size:1.2vw}
.day.more::after{content:'more ↓';position:absolute;bottom:.4vw;right:.7vw;font-size:.8vw;font-weight:700;color:#6b7280;background:rgba(255,255,255,.95);padding:.15vw .55vw;border-radius:1vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.month{grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.month .day{padding:.4vw;border-radius:.7vw}.month .dh strong{font-size:1.15vw}.month .dh{font-size:.75vw}
.month .today .dh strong{padding:.05vw .35vw}.month .today .dh>span:first-child::after{content:''}
.month .ev{font-size:.78vw;padding:.15vw .4vw;border-left-width:.25vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none}
.month .ev b{display:inline;font-size:.75vw}.month .ev .who{display:none}.month .other{opacity:.4}
.wkh{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:.8vw;font-size:.9vw;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.08vw;text-align:center;margin-bottom:-.3vw}
.dayv{grid-template-columns:1fr}.dayv .ev{font-size:1.6vw;padding:1vw 1.2vw}.dayv .ev b{font-size:1.5vw}.dayv .dh strong{font-size:2.6vw}
.empty{color:#9ca3af;font-size:1vw;padding:.3vw}
/* ---------- sidebar */
.side{width:24vw;display:flex;flex-direction:column;min-height:0}
.side h3{font-size:1.35vw;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.side h3 small{font-size:.85vw;color:#9ca3af;font-weight:500}
.ch,.up{background:#fff;border-radius:1.6vw;padding:1.2vw;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.08);min-height:0;overflow:hidden}
.ch{flex:0 1 auto;max-height:68%}.up{flex:1}
.kids{display:flex;flex-direction:column;flex:1 1 auto;-webkit-overflow-scrolling:touch;padding-bottom:.4vw;overflow-y:auto;min-height:0;scrollbar-width:none}
.kid .kh{display:flex;align-items:center;font-weight:800;font-size:1.3vw;margin-bottom:.45vw;color:var(--c)}
.kid .kh i{width:1.1vw;height:1.1vw;border-radius:50%}
.kid .kh .st{margin-left:auto;background:#fdf1d6;color:#8a5a12;border-radius:2vw;padding:.2vw .75vw;font-size:1.15vw;font-weight:800}
.cb{display:flex;align-items:center;width:100%;min-height:3.4vw;margin-bottom:.45vw;border:0;border-radius:1vw;padding:.5vw .8vw;font-size:1.15vw;font-weight:600;text-align:left;cursor:pointer;color:#1f2933;background:var(--t,#f4f1ec)}
.cb .bx{flex:none;width:2.3vw;height:2.3vw;border-radius:50%;border:.2vw solid var(--c);background:#fff;display:-webkit-box;display:flex;align-items:center;justify-content:center;font-size:1.25vw;font-weight:800;color:#fff}
.cb.done{opacity:.6}.cb.done .bx{background:var(--c)}.cb.done .tt{text-decoration:line-through}
.cb .sv{margin-left:auto;color:#a16207;white-space:nowrap;font-weight:700}.cb.busy{opacity:.3}.cb.ro .bx{border-style:dashed}
.agl{display:flex;flex-direction:column}
.ag{display:flex;align-items:center;padding:.6vw .2vw;font-size:1.15vw;font-weight:600;border-bottom:.08vw solid #efebe5}
.ag::before{content:'';flex:none;width:.45vw;align-self:stretch;border-radius:.3vw;background:var(--c)}
.ag b{min-width:5.4vw;white-space:nowrap;color:#6b7280;font-weight:700;font-size:1vw}.ag.past{opacity:.45}
.ag:last-child{border-bottom:0}
/* ---------- overlays */
#night{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:40;background:#05070b;background:radial-gradient(ellipse at 50% 45%,#0c111a 0,#030406 70%);display:none;align-items:center;justify-content:center;flex-direction:column}
#night.on{display:flex}
#night .nt{text-align:center;font-size:13vw;font-weight:200;letter-spacing:-.4vw;line-height:1;font-variant-numeric:tabular-nums;color:#4a3f33}
#night .nd{text-align:center;font-size:1.7vw;color:#2f2922;margin-top:1.2vw;letter-spacing:.1vw;font-weight:500}
#night .nh{position:absolute;bottom:2.4vw;left:0;right:0;text-align:center;color:#1f1b17;font-size:1vw;letter-spacing:.1vw}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:50;background:rgba(10,12,16,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
.ov.on{display:flex}
.ov .lbl{color:#fff;font-size:2.6vw;font-weight:700;letter-spacing:-.03vw;display:flex;align-items:center}
.ov .lbl::before{content:'🔔';font-size:2.4vw;margin-right:1vw;display:inline-block;-webkit-animation:ring .9s ease-in-out 1;animation:ring .9s ease-in-out 1}
@-webkit-keyframes ring{0%,60%,100%{-webkit-transform:rotate(0)}10%,30%{-webkit-transform:rotate(-14deg)}20%,40%{-webkit-transform:rotate(14deg)}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.ov .box{position:relative;width:88vw;max-width:150vh;height:78vh;background:#000;border-radius:1.6vw;overflow:hidden;border:.25vw solid rgba(255,255,255,.12)}
.ov iframe{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;overflow:hidden;display:block;background:#000}
.ov .live{position:absolute;top:1.2vw;left:1.2vw;background:#dc2626;color:#fff;font-weight:800;font-size:1vw;letter-spacing:.08vw;padding:.35vw .8vw;border-radius:2vw;z-index:2}
.ov .hint{color:#fff;background:rgba(255,255,255,.12);font-size:1.15vw;font-weight:600;padding:.7vw 1.8vw;border-radius:3vw}
/* ---------- add modal */
#am{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:60;background:rgba(31,41,51,.55);display:none;align-items:flex-start;justify-content:center;padding-top:2vh}
#am.on{display:flex}
.amb{width:62vw;max-height:94vh;overflow-y:auto;background:#fff;border-radius:1.8vw;padding:1.8vw 2.2vw;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amh{display:flex;align-items:center}.amh h2{font-size:2.1vw;margin-right:auto}
.amx{border:0;background:#f4f1ec;border-radius:50%;width:4.2vw;height:4.2vw;font-size:2vw;cursor:pointer;color:#374151}
.seg{display:flex;background:#f4f1ec;border-radius:3vw;padding:.35vw}.seg button{flex:1;border:0;background:none;font-size:1.5vw;font-weight:700;padding:.9vw 2vw;border-radius:3vw;color:#6b7280;cursor:pointer;min-height:4vw}.seg .on{background:#fff;color:#1f2933;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fl{display:flex;flex-direction:column}.fl>label{font-size:1.05vw;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06vw}
.ti{font-size:1.6vw;padding:.9vw 1.1vw;border:.15vw solid #e5e0d8;border-radius:1vw;width:100%;min-height:4vw;font-family:inherit;color:#1f2933;background:#faf8f5}
.ti:focus{outline:none;border-color:#1f2933;background:#fff}
.chips{display:flex;flex-wrap:wrap;margin:-.3vw}.chips>*{margin:.3vw}
.chip{border:.15vw solid #e5e0d8;background:#faf8f5;color:#1f2933;font-size:1.3vw;font-weight:600;padding:.7vw 1.3vw;border-radius:3vw;cursor:pointer;min-height:3.6vw;display:flex;align-items:center}
.chip.on{background:var(--c,#1f2933);border-color:var(--c,#1f2933);color:#fff}
.chip i{width:1.3vw;height:1.3vw;border-radius:50%;background:var(--c,#6b7280);border:.12vw solid #fff}
.row2{display:flex;align-items:flex-end}.row2 .fl{flex:1}
.amf{display:flex;align-items:center;margin-top:.4vw}.amf .msg{margin-right:auto;font-size:1.2vw;color:#b91c1c}.amf .msg.ok{color:#2f6b45}
.btn{border:0;border-radius:3vw;font-size:1.5vw;font-weight:800;padding:1vw 2.4vw;cursor:pointer;min-height:4.2vw}.btn.pri{background:#1f2933;color:#fff}.btn.sec{background:#f4f1ec;color:#374151}.btn:disabled{opacity:.45}
.stp{display:flex;align-items:center}.stp button{width:4vw;height:4vw;font-size:2vw;border:0;border-radius:50%;background:#f4f1ec;cursor:pointer}.stp b{font-size:1.7vw;min-width:5vw;text-align:center}
/* Chromium 74 (Dragon Touch WebView): no flex `gap`, so sibling margins emulate it */
@media (min-width:1200px){body{font-size:1vw}}@media (min-width:2200px){body{font-size:22px}}
body>.main{margin-top:1.2vw}
.top>*+*{margin-left:1.6vw}.top>.hchips{margin-left:auto}.hchips:empty+.addb{margin-left:auto}.top>.addb{margin-left:1.4vw}.top>.wx{margin-left:1.4vw}
.wx>*+*{margin-left:.7vw}.main>*+*{margin-left:1.2vw}
.cal>*+*{margin-top:1vw}.cal>#wkh:empty+.grid{margin-top:0}
.bar>*+*{margin-left:.6vw}.pfs>*+*{margin-left:0}.pf>*+*{margin-left:.35vw}.sum .row>*+*{margin-left:.6vw}.sum .row>b{margin-left:auto}
.day>*+*,.evs>*+*{margin-top:.5vw}.day>.evs{margin-top:.7vw}.month .day>*+*,.month .evs>*+*{margin-top:.25vw}
.side>*+*{margin-top:1.2vw}.ov>*+*{margin-top:1.4vw}.ov .box>.live{margin:0}
.up>*+*,.ch>*+*{margin-top:.8vw}.agl>*+*{margin-top:0}
.ag>*+*{margin-left:.8vw}.hchips>*+*{margin-left:.5vw}.hc>*+*{margin-left:.35vw}
.kids>*+*{margin-top:1vw}.kid .kh>*+*{margin-left:.5vw}.kid .kh>.st{margin-left:auto}
.cb>*+*{margin-left:.8vw}.cb>.sv{margin-left:auto}
.amb>*+*{margin-top:1.2vw}.amh>*+*{margin-left:1vw}.fl>*+*{margin-top:.5vw}.chip>*+*{margin-left:.6vw}
.row2>*+*{margin-left:1vw}.amf>*+*{margin-left:1vw}.amf>.msg{margin-right:auto}.stp>*+*{margin-left:.6vw}
.kids::-webkit-scrollbar,.evs::-webkit-scrollbar{display:none}
.hide{display:none!important}
.foot{position:fixed;bottom:.35vw;right:1.8vw;font-size:.7vw;color:#a8a29e}.foot.err{color:#b91c1c}
.kid .kh i{font-size:0}
/* ---- shared hero-today + larger text (B/C) */
.week{grid-template-columns:minmax(0,1.45fr) repeat(3,minmax(0,1fr))}
.ev{font-size:1.3vw;line-height:1.25;padding:.65vw .8vw}
.ev b{font-size:1.15vw}
.ev .who{font-size:.9vw}
.dh{font-size:1.15vw}.dh strong{font-size:2.6vw}
.today .dh strong{font-size:3vw}
.today .ev{font-size:1.4vw}
.ev.nx{position:relative;font-size:1.75vw;padding:1vw 1vw .9vw;line-height:1.2}
.ev.nx b{display:block;font-size:1.3vw;margin-bottom:.15vw}
.ev.nx .who{font-size:1vw}
.nxb{position:absolute;top:.7vw;right:.7vw;font-style:normal;font-size:.85vw;font-weight:800;letter-spacing:.08vw;text-transform:uppercase;padding:.2vw .6vw;border-radius:2vw}
.free{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;border-radius:1vw;padding:1vw}
.free .fi{font-size:4vw;line-height:1}.free b{font-size:1.8vw;margin-top:.6vw}.free span{font-size:1.15vw;margin-top:.2vw}
.free.sm{flex:0 0 auto;font-size:1vw;font-weight:600;padding:.4vw;align-items:flex-start}
.evs{-webkit-box-flex:1;flex:1}
.cb{font-size:1.3vw;min-height:3.8vw}
.kid .kh{font-size:1.45vw}
.ag{font-size:1.3vw}.ag b{font-size:1.1vw;min-width:6vw}
.side h3{font-size:1.5vw}
.sum .row{font-size:1.25vw}
.kid .kh i{width:2.4vw;height:2.4vw;color:#fff;font-style:normal;font-size:1.2vw;font-weight:800;display:-webkit-box;display:flex;align-items:center;justify-content:center}
.evs>*{-ms-flex-negative:0;flex-shrink:0}
.ev.pastev{opacity:.45}
.ev.nx{padding-top:2.2vw}.nxb{top:.6vw;left:1vw;right:auto}
/* ===== Direction C: colorful kid-friendly */
body{background:#fdf8f1;font-family:"Nunito","Quicksand","Inter",Roboto,Helvetica,Arial,sans-serif}
.time{font-weight:800;color:#2d2a3e;letter-spacing:-.1vw}
.date{color:#7c7891;font-weight:700}
.wx,.cal,.ch,.up{border-radius:2vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.addb{background:#ff7a59;box-shadow:0 1px 2px rgba(0,0,0,.08);border-radius:3vw}
.bar h2{color:#2d2a3e;font-weight:800}
.nav,.tg,.seg,.amx,.btn.sec,.stp button{background:#f6efe4}
.tg .on{background:#fff}
.pf i{width:2.2vw;height:2.2vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.day{background:#f8f4ee;border-radius:1.5vw}
.week .day:nth-child(1){background:#eaf2ff}.week .day:nth-child(2){background:#fff0f6}.week .day:nth-child(3){background:#f2eeff}.week .day:nth-child(4){background:#e8f7f0}
.week .day:nth-child(5){background:#fff5e6}.week .day:nth-child(6){background:#eaf7fb}.week .day:nth-child(7){background:#fdf0ea}
.dh{color:#7c7891;font-weight:800}.dh strong{color:#2d2a3e;font-weight:800}
.today{background:#fff!important;border:.3vw solid #ff7a59}
.today .dh strong{background:#ff7a59;border-radius:1vw}.today .dh>span:first-child::after{color:#ff7a59}
.ev{border-radius:1vw;border-left:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:.7vw .9vw .7vw 1.1vw;position:relative;overflow:hidden;font-weight:700}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.5vw;background:var(--c)}
.ev.ad{background:var(--c)}.ev.ad::before{display:none}
.ev.nx{background:var(--t);border:.2vw solid var(--c)}
.nxb{background:var(--c);color:#fff}
.free{background:#fff7e0;color:#8a6d1f;border-radius:1.4vw}.free b{color:#5c4a12}
.free.sm{background:none;color:#b3aca0}
.day.sum{background:#fff;border:.18vw solid #efe6d8}
.sum .row i{width:1.3vw;height:1.3vw}
.day.more::after{border-radius:2vw;background:#fff}
.kid{background:var(--t);border-radius:1.6vw;padding:.8vw}
.kids>*+*{margin-top:.8vw}
.kid .kh{color:#2d2a3e;font-size:1.6vw}
.kid .kh i{width:3.2vw;height:3.2vw;font-size:1.6vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kid .kh .st{background:#ffd84d;color:#6b4c00;font-size:1.3vw;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cb{background:#fff;border-radius:1.2vw;min-height:4vw;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cb .bx{width:2.7vw;height:2.7vw;border-width:.25vw}

<script>
const TZ='America/Chicago', REFRESH=5*60*1000;
let cfg={people:[],camera:{}}, view='week', anchor=today(), cache={}, hidden=new Set(), lastOk=null;
const $=id=>document.getElementById(id);
function partsInTZ(d){const o={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);
 // Chromium 74 (V8 7.4) ignores hourCycle and returns 12h hour + dayPeriod; normalize to 00-23
 let h=+o.hour%12;if(o.dayPeriod){if(/p/i.test(o.dayPeriod))h+=12}else h=+o.hour%24;o.hour=(h<10?'0':'')+h;return o}
function today(){const p=partsInTZ(new Date());return `${p.year}-${p.month}-${p.day}`}
function nowHM(){const p=partsInTZ(new Date());return `${p.hour}:${p.minute}`}
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dow=s=>D(s).getUTCDay();
const fmt=(s,o)=>D(s).toLocaleDateString('en-US',{timeZone:'UTC',...o});
function t12(hm,ampm){let [h,m]=hm.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return (m?`${h}:${String(m).padStart(2,'0')}`:`${h}:00`)+(ampm?' '+ap:ap[0].toLowerCase())}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL={Jack:'#4c8dff',Liv:'#ff5fa2',Mom:'#9b7bff',Dad:'#2bb673',Bruce:'#ff9f1c',Family:'#6c7a93'};
const TINT={Jack:'#e6efff',Liv:'#ffe8f2',Mom:'#efe9ff',Dad:'#e2f6ec',Bruce:'#fff1dc',Family:'#eef1f6'};
const pc=p=>PAL[p.name]||p.color;
const ini=n=>(n||'?').charAt(0).toUpperCase();
function color(names){const p=cfg.people.find(p=>p.name===names[0]);return p?pc(p):PAL.Family}

let curDay=today();
function tick(){const d=new Date();const nd=today();
 if(nd!==curDay){if(anchor===curDay)anchor=nd;curDay=nd;cache={};load(true)} // roll over at midnight (America/Chicago)
 $('time').textContent=d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
 $('date').textContent=d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const t=today(); if(t!==tick.last){if(tick.last&&anchor===tick.last)anchor=t;tick.last=t;render()}
 if(d.getSeconds()===0)renderAgenda();}

function rangeFor(){if(view==='day')return [anchor,anchor];
 if(view==='week')return [anchor,add(anchor,6)]; // rolling 7 days starting at anchor (today by default)
 const f=anchor.slice(0,8)+'01',s=add(f,-dow(f));return [s,add(s,41)]}

async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()}
async function load(force){const [s,e]=rangeFor(),t=today();const want=[[s,e],[t,t]];
 try{for(const [a,b] of want){const k=a+'|'+b;if(force||!cache[k])cache[k]=(await getJSON(`api/events?start=${a}&end=${b}`)).events}
  lastOk=new Date();$('foot').className='foot';$('foot').textContent='Updated '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}
 catch(err){$('foot').className='foot err';$('foot').textContent='Calendar unavailable ('+err.message+')'+(lastOk?' · showing data from '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}):'')}
 render()}

function eventsOn(list,day){return list.filter(e=>!e.people.length||e.people.some(p=>!hidden.has(p))).filter(e=>e.allDay?(e.start<=day&&e.end>=day):e.start.slice(0,10)===day)}
function evHTML(e,nx){const c=color(e.people);const who=e.people.join(', ');const nc=nx?' nx':'',nb=nx?`<em class="nxb">${nx}</em>`:'';
 return e.allDay?`<div class="ev ad" style="--c:${c};--t:${TINT[e.people[0]]||TINT.Family}">${esc(e.title)}<span class="who">${esc(who)}</span></div>`
 :`<div class="ev${nc}" style="--c:${c};--t:${TINT[e.people[0]]||TINT.Family}">${nb}<b>${t12(e.start.slice(11,16),view==='day')}</b> ${esc(e.title)}<span class="who">${esc(who)}</span></div>`}

function dayBody(d,evs,t){const now=nowHM();
 if(!evs.length){if(d===t&&view!=='month')return '<div class="free"><span class="fi">☀️</span><b>Nothing scheduled</b><span>Enjoy a free day</span></div>';
  return view==='week'?'<div class="free sm">Free day</div>':view==='day'?'<div class="empty">Nothing scheduled</div>':''}
 let nxi=-1;if(d===t&&view!=='month')for(let i=0;i<evs.length;i++){const e=evs[i];if(!e.allDay&&(e.end.slice(0,10)>t||e.end.slice(11,16)>now)){nxi=i;break}}
 if(nxi<0)return evs.map(e=>evHTML(e)).join('');
 const nx=evs[nxi],past=evs.filter(e=>!e.allDay&&e!==nx&&e.end.slice(0,10)===t&&e.end.slice(11,16)<=now),rest=evs.filter(e=>e!==nx&&past.indexOf(e)<0);
 return evHTML(nx,nx.start.slice(11,16)<=now?'Happening now':'Up next')+rest.map(e=>evHTML(e)).join('')+past.map(e=>evHTML(e).replace('class="ev','class="ev pastev')).join('')}
function render(){const [s,e]=rangeFor(),list=cache[s+'|'+e];const t=today(),g=$('grid');
 g.className='grid '+(view==='day'?'dayv':view);
 $('range').textContent=view==='day'?fmt(s,{weekday:'short',month:'short',day:'numeric'}):view==='week'?(fmt(s,{month:'short',day:'numeric'})+' – '+(s.slice(5,7)===e.slice(5,7)?fmt(e,{day:'numeric'}):fmt(e,{month:'short',day:'numeric'}))):fmt(anchor,{month:'long',year:'numeric'});
 $('wkh').className=view==='month'?'wkh':'';$('wkh').innerHTML=view==='month'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join(''):'';
 if(!list){g.innerHTML='<div class="empty">Loading…</div>';return}
 const n=view==='day'?1:view==='week'?7:42;let h='';
 for(let i=0;i<n;i++){const d=add(s,i),evs=eventsOn(list,d);const other=view==='month'&&d.slice(5,7)!==anchor.slice(5,7);
  h+=`<div class="day${d===t?' today':''}${view==='week'&&evs.length>3?' busy':''}${other?' other':''}"><div class="dh"><span>${fmt(d,{weekday:view==='day'?'long':'short'})}</span>${view!=='month'?dayWx(d):''}<strong>${fmt(d,{day:'numeric'})}</strong></div><div class="evs">${dayBody(d,evs,t)}</div></div>`}
 if(view==='week'){const cnt={};let tot=0;for(let i=0;i<7;i++)for(const ev of eventsOn(list,add(s,i))){tot++;for(const p of (ev.people.length?ev.people:['Family']))cnt[p]=(cnt[p]||0)+1}
  h+=`<div class="day sum"><div class="dh"><span>Next 7 days</span><strong>${tot}</strong></div><div class="evs">${cfg.people.filter(p=>cnt[p.name]).map(p=>`<div class="row"><i style="background:${pc(p)}"></i>${esc(p.name)}<b>${cnt[p.name]}</b></div>`).join('')||'<div class="empty">Nothing scheduled</div>'}</div></div>`}
 g.innerHTML=h;
 g.querySelectorAll('.day').forEach(d=>{const v=d.querySelector('.evs');if(v&&v.scrollHeight>v.clientHeight+2)d.classList.add('more')});
 renderAgenda()}

function renderAgenda(){const t=today(),list=cache[t+'|'+t];if(!list)return;const now=nowHM();
 const evs=eventsOn(list,t);const ad=evs.filter(e=>e.allDay),timed=evs.filter(e=>!e.allDay).filter(e=>e.end.slice(0,10)>t||e.end.slice(11,16)>now);
 $('agenda').className='agl';
 $('agenda').innerHTML=ad.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>All day</b><span>${esc(e.title)}</span></div>`).join('')+
  timed.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>${e.start.slice(11,16)<=now?'Now':t12(e.start.slice(11,16),true)}</b><span>${esc(e.title)}</span></div>`).join('')||'<div class="empty">Nothing else today 🎉</div>'}

function renderPeople(){$('pfs').innerHTML=cfg.people.map(p=>`<button class="pf${hidden.has(p.name)?' off':''}" data-n="${esc(p.name)}"><i style="background:${pc(p)}">${esc(p.initial)}</i>${esc(p.name)}</button>`).join('')}
$('pfs').onclick=e=>{const b=e.target.closest('.pf');if(!b)return;const n=b.dataset.n;hidden.has(n)?hidden.delete(n):hidden.add(n);renderPeople();render()};
$('tg').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('tg').children].forEach(x=>x.classList.toggle('on',x===b));anchor=today();load()};
$('prev').onclick=()=>{anchor=view==='day'?add(anchor,-1):view==='week'?add(anchor,-7):add(anchor.slice(0,8)+'01',-1);load()};
$('todayb').onclick=()=>{anchor=today();load()};
$('next').onclick=()=>{anchor=view==='day'?add(anchor,1):view==='week'?add(anchor,7):add(add(anchor.slice(0,8)+'01',32).slice(0,8)+'01',0);load()};

// ---------------------------------------------------------------- + Add (event / task)
let addKind='event',addDay=null,addWho=[],addAllDay=true,addStars=0,addBusy=false;
function addOpen(){addKind='event';addDay=today();addWho=[];addAllDay=true;addStars=0;$('aTitle').value='';$('aTkTime').value='';$('aMsg').textContent='';$('aMsg').className='msg';
 const p=partsInTZ(new Date()),h=Math.min(22,(+p.hour)+1);$('aStart').value=String(h).padStart(2,'0')+':00';$('aEnd').value=String(h+1).padStart(2,'0')+':00';
 addRender();$('am').classList.add('on')}
function addClose(){$('am').classList.remove('on');if(document.activeElement)document.activeElement.blur()}
function addRender(){const ev=addKind==='event';
 [...$('amk').children].forEach(b=>b.classList.toggle('on',b.dataset.k===addKind));
 $('amt').textContent=ev?'Add event':'Add task';$('aSave').textContent=ev?'Add event':'Add task';
 $('aWhoL').textContent=ev?'For (tap one or more)':'For (tap one or more · one chore each)';
 $('evOnly').classList.toggle('hide',!ev);$('tkOnly').classList.toggle('hide',ev);
 const ps=cfg.addPeople||[];
 $('aWho').innerHTML=ps.map(p=>`<button class="chip${addWho.indexOf(p.id)>=0?' on':''}" style="--c:${pc(p)}" data-id="${esc(p.id)}"><i></i>${esc(p.name)}</button>`).join('')+
  (ps.some(p=>p.name==='Jack')&&ps.some(p=>p.name==='Liv')?'<button class="chip" data-kids="1">👧👦 Both kids</button>':'')||'<span class="empty">No profiles</span>';
 let dh='';for(let i=0;i<7;i++){const d=add(today(),i);dh+=`<button class="chip${d===addDay?' on':''}" data-d="${d}">${i===0?'Today':i===1?'Tomorrow':fmt(d,{weekday:'short',month:'short',day:'numeric'})}</button>`}
 const other=addDay>add(today(),6)||addDay<today();
 $('aDays').innerHTML=dh+`<input class="ti" type="date" id="aDate" style="width:auto;min-height:3.6vw;font-size:1.3vw${other?';border-color:#2563eb':''}" value="${addDay}">`;
 $('aDate').onchange=e=>{if(e.target.value){addDay=e.target.value;addRender()}};
 $('aAll').classList.toggle('on',addAllDay);$('aTimed').classList.toggle('on',!addAllDay);$('aTimes').classList.toggle('hide',addAllDay);
 $('sVal').textContent=addStars+' ⭐'}
$('addb').onclick=addOpen;$('amx').onclick=addClose;$('aCancel').onclick=addClose;
$('am').onclick=e=>{if(e.target===$('am'))addClose()};
$('amk').onclick=e=>{const b=e.target.closest('button');if(!b)return;addKind=b.dataset.k;addRender()};
$('aWho').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ps=cfg.addPeople||[];
 if(b.dataset.kids){const ids=ps.filter(p=>p.name==='Jack'||p.name==='Liv').map(p=>p.id);const all=ids.every(i=>addWho.indexOf(i)>=0);
  addWho=addWho.filter(i=>ids.indexOf(i)<0);if(!all)addWho=addWho.concat(ids)}
 else{const id=b.dataset.id,k=addWho.indexOf(id);if(k>=0)addWho.splice(k,1);else addWho.push(id)}addRender()};
$('aDays').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;addDay=b.dataset.d;addRender()};
$('aAll').onclick=()=>{addAllDay=true;addRender()};$('aTimed').onclick=()=>{addAllDay=false;addRender()};
$('aStart').onchange=()=>{const s=$('aStart').value;if(s&&$('aEnd').value<=s){const h=Math.min(23,+s.slice(0,2)+1);$('aEnd').value=(h===+s.slice(0,2)?'23:59':String(h).padStart(2,'0')+s.slice(2))}};
$('sMinus').onclick=()=>{addStars=Math.max(0,addStars-1);addRender()};$('sPlus').onclick=()=>{addStars=Math.min(20,addStars+1);addRender()};
$('aTkClr').onclick=()=>{$('aTkTime').value=''};
$('aSave').onclick=async()=>{if(addBusy)return;const m=$('aMsg');m.className='msg';
 const title=$('aTitle').value.trim();if(!title){m.textContent='Add a title';return}
 if(!addWho.length){m.textContent='Pick who it\'s for';return}
 let url,body;if(addKind==='event'){url='api/events/create';body={title:title,date:addDay,allDay:addAllDay,profiles:addWho};
  if(!addAllDay){body.start=$('aStart').value;body.end=$('aEnd').value;if(!body.start||!body.end||body.end<=body.start){m.textContent='End must be after start';return}}}
 else{url='api/chores/create';body={title:title,date:addDay,profiles:addWho,stars:addStars};if($('aTkTime').value)body.time=$('aTkTime').value}
 addBusy=true;$('aSave').disabled=true;m.textContent='Saving…';m.className='msg ok';
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(x){}throw new Error(d||r.status)}
  m.textContent='Added ✓';cache={};load(true);loadChores();setTimeout(addClose,700)}
 catch(err){m.className='msg';m.textContent='Could not save: '+err.message}
 finally{addBusy=false;$('aSave').disabled=false}};

let ovTimer=null,seenRing=undefined;
const camHost=u=>(u||'').replace('{host}',location.hostname);
function openCam(ring){const c=cfg.camera||{};if(!c.url)return;snapStop();
 $('ovlbl').textContent=ring?"Someone's at the front door":(c.name||'Camera');
 if(!$('ovbox').querySelector('iframe')){const f=document.createElement('iframe');f.src=camHost(c.url);f.allow='autoplay; fullscreen';
  f.setAttribute('scrolling','no');f.setAttribute('frameborder','0');f.style.pointerEvents='none';$('ovbox').prepend(f)}
 wake(120000);$('ov').classList.add('on');clearTimeout(ovTimer);ovTimer=setTimeout(closeCam,60000)}
function closeCam(){clearTimeout(ovTimer);$('ov').classList.remove('on');const f=$('ovbox').querySelector('iframe');if(f){f.src='about:blank';f.remove()}snapTick()}
function setupCamera(){if(location.hash==='#ring')openCam(true)} // demo: /dashboard/#ring (no stream is loaded until a ring)
$('ov').onclick=closeCam;
// sidebar doorbell snapshot (no live stream): go2rtc frame.jpeg every ~8s, preloaded offscreen, swapped on load
const SNAP_URL='http://{host}:1984/api/frame.jpeg?src=doorbell',SNAP_MS=8000;
let snapT=null,snapBusy=false,snapOk=false;
function snapPaused(){return document.hidden||$('night').classList.contains('on')||$('ov').classList.contains('on')}
function snapStop(){clearTimeout(snapT);snapT=null}
function snapTick(){snapStop();if(snapPaused())return;snapT=setTimeout(snapTick,SNAP_MS);
 if(snapBusy)return;snapBusy=true;
 const im=new Image();
 im.onload=function(){snapBusy=false;$('camimg').src=im.src;if(!snapOk){snapOk=true;$('camp').className='up cam ok'}};
 im.onerror=function(){snapBusy=false;snapOk=false;$('camp').className='up cam';$('camtx').textContent='Front door camera unavailable'};
 im.src=camHost(SNAP_URL)+'&t='+Date.now()}
document.addEventListener('visibilitychange',function(){if(document.hidden)snapStop();else snapTick()});
$('camp').onclick=function(){openCam(false)};
async function pollRing(){try{const d=await getJSON('api/doorbell');
  if(seenRing===undefined)seenRing=d.last_ring;
  else if(d.last_ring&&d.last_ring!==seenRing){seenRing=d.last_ring;openCam(true)}}catch(e){}}
setInterval(pollRing,2000);

let wxDays={};
function dayWx(d){const w=wxDays[d];if(!w)return '';const hl=[w.hi,w.lo].filter(x=>x!==null&&x!==undefined).map(x=>x+'°').join(' / ');return `<span class="dw">${w.icon||''} ${hl}</span>`}
async function weather(){try{const d=await getJSON('api/weather');wxDays={};(d.days||[]).forEach(x=>wxDays[x.date]=x);
  const c=d.current||{},t=wxDays[today()]||{};const hl=(t.hi!=null?'H '+t.hi+'° ':'')+(t.lo!=null?'L '+t.lo+'°':'');
  $('wx').innerHTML=`<span class="ic">${c.icon||'🌡️'}</span><b>${c.temp!=null?c.temp+'°F':'--'}</b> <span>${esc(c.text||'')}</span><span class="hl">${hl}</span>`;render()}
 catch(e){$('wx').innerHTML='<span class="ic">🌡️</span><span>Weather unavailable</span>'}}

async function loadHome(){try{const d=await getJSON('api/home');$('hchips').innerHTML=(d.chips||[]).map(c=>`<span class="hc ${c.level}" title="${esc(c.id)}">${c.icon} ${esc(c.name)} · ${esc(c.label)}</span>`).join('')}catch(e){}}
let chData=null,chBusy=false;
async function loadChores(){try{chData=await getJSON('api/chores');renderChores()}catch(e){if(!chData)$('kids').innerHTML='<div class="empty">Chores unavailable</div>'}}
function renderChores(){if(!chData)return;const ks=chData.kids||[];
 $('kids').innerHTML=ks.map(k=>`<div class="kid" style="--c:${pc(k)};--t:${TINT[k.name]||TINT.Family}"><div class="kh"><i style="background:${pc(k)}">${ini(k.name)}</i>${esc(k.name)}<span class="st">⭐ ${k.stars}</span></div>`+
  (k.chores.length?k.chores.map(c=>`<button class="cb${c.done?' done':''}${c.tappable?'':' ro'}" data-id="${c.id}" data-ro="${c.tappable?0:1}"><span class="bx">${c.done?'✓':''}</span><span class="tt">${esc(c.title)}</span>${c.stars?`<span class="sv">+${c.stars}⭐</span>`:''}</button>`).join(''):'<div class="empty">No chores today</div>')+'</div>').join('')||'<div class="empty">No chores today</div>'}
$('kids').onclick=async e=>{const b=e.target.closest('.cb');if(!b||chBusy)return;
 if(b.dataset.ro==='1'){$('chmsg').textContent='repeating chore: check off in the eCalendar app';setTimeout(()=>$('chmsg').textContent='tap to check off',5000);return}
 chBusy=true;b.classList.add('busy');
 try{const r=await fetch('api/chores/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:b.dataset.id})});
  if(!r.ok)throw new Error(r.status);const d=await r.json();chData={day:d.day,kids:d.kids};renderChores()}
 catch(err){b.classList.remove('busy');$('chmsg').textContent='could not save ('+err.message+')'}
 finally{chBusy=false}};

// night dim: near-black overlay between cfg.night.start and end (America/Chicago); tap or doorbell wakes for 2 min
let wakeUntil=0;
const toMin=s=>{const a=String(s||'0:0').split(':');return (+a[0])*60+(+a[1]||0)};
function isNight(){const n=cfg.night||{start:'21:00',end:'06:00'},p=partsInTZ(new Date()),m=(+p.hour)*60+(+p.minute),a=toMin(n.start),b=toMin(n.end);
 if(location.hash==='#night')return true;return a<=b?(m>=a&&m<b):(m>=a||m<b)}
function wake(ms){wakeUntil=Date.now()+(ms||120000);nightTick()}
function nightTick(){const on=isNight()&&Date.now()>wakeUntil&&!$('ov').classList.contains('on');$('night').classList.toggle('on',on);
 if(on)snapStop();else if(!snapT)snapTick();
 if(on){const d=new Date();$('ntime').textContent=d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});$('ndate').textContent=d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'})}}
$('night').addEventListener('click',e=>{e.stopPropagation();wake(120000)});
document.addEventListener('touchstart',()=>{if(!$('night').classList.contains('on')&&isNight())wake(120000)},{passive:true});
setInterval(nightTick,1000);

(async()=>{tick();setInterval(tick,1000);
 try{cfg=await getJSON('api/config')}catch(e){$('foot').className='foot err';$('foot').textContent='Config unavailable'}
 renderPeople();setupCamera();snapTick();nightTick();weather();loadChores();loadHome();await load();
 setInterval(()=>{cache={};load(true)},REFRESH);setInterval(weather,15*60*1000);setInterval(loadChores,60000);setInterval(loadHome,15000);
 setInterval(()=>location.reload(),6*3600*1000);})();
</script>
<!-- ===== KIOSK EXIT HOOK (Android app) - keep when redesigning: hold the clock (#time, or #ntime in night mode) 3s -> window.KioskApp.exit() ===== -->
<script>
(function(){
  var HOLD=3000, C=2*Math.PI*26, t=null, raf=null, start=0, ring=null, sx=0, sy=0;
  function stop(){ if(t){clearTimeout(t);t=null;} if(raf){cancelAnimationFrame(raf);raf=null;} if(ring){ring.parentNode.removeChild(ring);ring=null;} }
  function tick(){ if(!ring) return; var p=Math.min(1,(Date.now()-start)/HOLD); ring.querySelector('circle+circle').setAttribute('stroke-dashoffset',String(C*(1-p))); raf=requestAnimationFrame(tick); }
  function begin(el,x,y){
    if(!(window.KioskApp && window.KioskApp.exit)) return; // normal browser: do nothing
    stop(); sx=x; sy=y; var r=el.getBoundingClientRect();
    ring=document.createElement('div');
    ring.style.cssText='position:fixed;width:60px;height:60px;pointer-events:none;z-index:9999;opacity:.75;left:'+(r.left+r.width/2-30)+'px;top:'+(r.top+r.height/2-30)+'px';
    ring.innerHTML='<svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="4"/><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(128,128,128,.85)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 30 30)" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>';
    document.body.appendChild(ring); start=Date.now(); tick();
    t=setTimeout(function(){ stop(); try{window.KioskApp.exit();}catch(x){} }, HOLD);
  }
  ['time','ntime'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.style.webkitUserSelect='none'; el.style.userSelect='none'; el.style.webkitTouchCallout='none';
    el.addEventListener('touchstart',function(e){var q=e.touches[0];begin(el,q.clientX,q.clientY);},{passive:true});
    el.addEventListener('mousedown',function(e){begin(el,e.clientX,e.clientY);});
    el.addEventListener('touchmove',function(e){var q=e.touches[0]; if(Math.abs(q.clientX-sx)>20||Math.abs(q.clientY-sy)>20) stop();},{passive:true});
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(n){ el.addEventListener(n,stop,{passive:true}); });
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
})();
</script>
<!-- ===== END KIOSK EXIT HOOK ===== -->
