<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baker Family</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#0f172a;display:flex;flex-direction:column;padding:1.25vw;gap:1vw;overflow:hidden;font-size:clamp(12px,1vw,22px);user-select:none}
.top{flex:0 0 auto;min-height:5.7vw;background:#fff;border-radius:1.25vw;display:flex;align-items:center;padding:.6vw 1.9vw;gap:2vw;box-shadow:0 2px 8px #0001}
.time{font-size:3.3vw;font-weight:700;font-variant-numeric:tabular-nums}.date{font-size:1.55vw;color:#475569}
.wx{margin-left:auto;font-size:1.55vw;display:flex;gap:.7vw;align-items:center}.wx .ic{font-size:2.7vw}
.main{flex:1;display:flex;gap:1vw;min-height:0}
.cal{flex:1;min-width:0;background:#fff;border-radius:1.25vw;padding:1.25vw;display:flex;flex-direction:column;gap:.85vw;box-shadow:0 2px 8px #0001}
.bar{display:flex;align-items:center;gap:.6vw}.bar h2{font-size:1.5vw;margin-right:auto;white-space:nowrap}
.nav.tb{width:auto;padding:0 .9vw;font-size:1vw;font-weight:600}
.nav{font-size:1.5vw;background:#f1f5f9;border:0;border-radius:.6vw;width:2.6vw;height:2.6vw;cursor:pointer;color:#334155}
.tg{display:flex;background:#e2e8f0;border-radius:.85vw;padding:.3vw}.tg button{border:0;background:none;padding:.55vw .9vw;font-size:1.05vw;border-radius:.6vw;font-weight:600;color:#0f172a;cursor:pointer}.tg .on{background:#fff;box-shadow:0 1px 4px #0002}
.pfs{display:flex;gap:.3vw;flex-wrap:nowrap;min-width:0;overflow:hidden}.bar .nav,.bar .tg{flex:none}.pf{display:flex;align-items:center;gap:.5vw;font-size:.95vw;font-weight:600;background:#f8fafc;border-radius:2vw;padding:.25vw .6vw .25vw .25vw;white-space:nowrap;border:0;cursor:pointer;color:inherit}
.pf i{width:2vw;height:2vw;border-radius:50%;color:#fff;font-style:normal;display:grid;place-items:center}.pf.off{opacity:.35}
.grid{flex:1;display:grid;gap:.5vw;min-height:0}
.week{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.day.sum{background:transparent;outline:.12vw dashed #cbd5e1;outline-offset:-.12vw}.sum .row{display:flex;align-items:center;gap:.5vw;font-size:1vw;color:#334155;padding:.15vw .2vw}.sum .row i{width:.9vw;height:.9vw;border-radius:50%;flex:none}.sum .row b{margin-left:auto}
.day.more{position:relative}.day.more::after{content:'more ↓';position:absolute;bottom:.3vw;right:.6vw;font-size:.75vw;color:#64748b;background:#fffd;padding:.1vw .4vw;border-radius:.3vw}
.day{background:#f8fafc;border-radius:.85vw;padding:.6vw;display:flex;flex-direction:column;gap:.5vw;min-height:0;overflow:hidden}
.today{background:#eff6ff;outline:.16vw solid #3b82f6;outline-offset:-.16vw}
.dh{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05vw;color:#64748b;padding:.2vw}.dh strong{font-size:1.75vw;color:#0f172a}
.evs{display:flex;flex-direction:column;gap:.5vw;overflow-y:auto;min-height:0;scrollbar-width:none}
.ev{background:color-mix(in srgb,var(--c) 16%,white);border-left:.32vw solid var(--c);border-radius:.5vw;padding:.6vw;font-size:1vw;line-height:1.3;word-break:break-word}
.ev.ad{background:var(--c);color:#fff;border-left-color:color-mix(in srgb,var(--c) 70%,black);font-weight:600;padding:.4vw .6vw}
.ev .who{font-size:.8vw;opacity:.75;display:block}
.month{grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.month .day{padding:.35vw;gap:.25vw}.month .dh strong{font-size:1.1vw}.month .dh{font-size:.8vw}.month .ev{font-size:.75vw;padding:.15vw .35vw;border-left-width:.25vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month .ev .who{display:none}.month .other{opacity:.45}
.wkh{display:grid;grid-template-columns:repeat(7,1fr);gap:.5vw;font-size:.9vw;color:#64748b;text-align:center;margin-bottom:-.3vw}
.dayv{grid-template-columns:1fr}.dayv .ev{font-size:1.4vw;padding:.9vw}.dayv .dh strong{font-size:2vw}
.empty{color:#94a3b8;font-size:.95vw;padding:.3vw}
.side{width:23vw;display:flex;flex-direction:column;gap:.75vw;min-height:0}
.side h3{font-size:1.25vw;display:flex;justify-content:space-between;align-items:baseline}.side h3 small{font-size:.85vw;color:#64748b;font-weight:400}
.ov{position:fixed;inset:0;z-index:50;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1vw}
.ov.on{display:flex}
.ov .box{position:relative;width:min(92vw,150vh);height:82vh;background:#000;border-radius:1vw;overflow:hidden}
.ov iframe{position:absolute;inset:0;width:100%;height:100%;border:0;overflow:hidden;display:block;background:#000}
.ov .lbl{color:#fff;font-size:2.6vw;font-weight:700;text-shadow:0 2px 6px #000}
.ov .live{position:absolute;top:1vw;left:1vw;background:#dc2626;color:#fff;font-weight:700;font-size:1vw;padding:.3vw .6vw;border-radius:.4vw;z-index:2}
.ov .hint{color:#cbd5e1;font-size:1vw}
.up{flex:1;background:#fff;border-radius:1.25vw;padding:1vw;display:flex;flex-direction:column;gap:.6vw;box-shadow:0 2px 8px #0001;min-height:0;overflow:hidden}
.ag{display:flex;gap:.75vw;align-items:center;padding:.7vw;border-radius:.6vw;font-size:1.1vw;background:color-mix(in srgb,var(--c) 14%,white);border-left:.32vw solid var(--c)}.ag b{min-width:5.2vw;white-space:nowrap}.ag.past{opacity:.45}
.hchips{display:flex;gap:.5vw;align-items:center;min-width:0}.hchips:empty{display:none}.hc{display:flex;align-items:center;gap:.35vw;font-size:.95vw;font-weight:600;padding:.3vw .7vw;border-radius:2vw;white-space:nowrap;background:#dcfce7;color:#166534}.hc.warn{background:#fef3c7;color:#92400e;outline:.12vw solid #f59e0b}.hc.info{background:#f1f5f9;color:#475569}
.wx .hl{color:#475569;font-size:1.25vw}
.dh .dw{font-size:.95vw;color:#475569;margin-left:auto;margin-right:.6vw;white-space:nowrap}
.ch{flex:0 1 auto;background:#fff;border-radius:1.25vw;padding:1vw;display:flex;flex-direction:column;gap:.6vw;box-shadow:0 2px 8px #0001;min-height:0;max-height:62%;overflow:hidden}
.kids{display:flex;flex-direction:column;gap:.7vw;overflow-y:auto;min-height:0;scrollbar-width:none}
.kid .kh{display:flex;align-items:center;gap:.5vw;font-weight:700;font-size:1.2vw;margin-bottom:.35vw}.kid .kh i{width:1vw;height:1vw;border-radius:50%}.kid .kh .st{margin-left:auto;background:#fef3c7;color:#92400e;border-radius:1vw;padding:.15vw .6vw;font-size:1.1vw}
.cb{display:flex;align-items:center;gap:.7vw;width:100%;min-height:3.4vw;margin-bottom:.4vw;border:0;border-radius:.7vw;padding:.5vw .8vw;font-size:1.1vw;text-align:left;cursor:pointer;color:#0f172a;background:#f1f5f9;border-left:.4vw solid var(--c)}
.cb .bx{flex:none;width:2.1vw;height:2.1vw;border-radius:50%;border:.2vw solid var(--c);display:grid;place-items:center;font-size:1.2vw;color:#fff}
.cb.done{opacity:.55}.cb.done .bx{background:var(--c)}.cb.done .tt{text-decoration:line-through}.cb .sv{margin-left:auto;color:#b45309;white-space:nowrap}.cb.busy{opacity:.3}.cb.ro .bx{border-style:dashed}
#night{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;color:#334155}
#night.on{display:flex}#night .nt{font-size:9vw;font-weight:300;font-variant-numeric:tabular-nums;color:#3b4252}#night .nd{font-size:1.6vw;color:#2a303b}
.addb{flex:none;border:0;background:#2563eb;color:#fff;font-weight:800;font-size:1.6vw;padding:.9vw 1.8vw;border-radius:1vw;cursor:pointer;box-shadow:0 2px 8px #2563eb55;min-height:4vw}
.addb:active{transform:scale(.97)}
#am{position:fixed;inset:0;z-index:60;background:#0f172acc;display:none;align-items:flex-start;justify-content:center;padding-top:2vh}
#am.on{display:flex}
.amb{width:62vw;max-height:94vh;overflow-y:auto;background:#fff;border-radius:1.4vw;padding:1.6vw 2vw;display:flex;flex-direction:column;gap:1.1vw;box-shadow:0 10px 40px #0006}
.amh{display:flex;align-items:center;gap:1vw}.amh h2{font-size:2vw;margin-right:auto}
.amx{border:0;background:#f1f5f9;border-radius:50%;width:4.2vw;height:4.2vw;font-size:2vw;cursor:pointer;color:#334155}
.seg{display:flex;background:#e2e8f0;border-radius:1vw;padding:.35vw}.seg button{flex:1;border:0;background:none;font-size:1.5vw;font-weight:700;padding:.9vw 2vw;border-radius:.75vw;color:#334155;cursor:pointer;min-height:4vw}.seg .on{background:#fff;color:#0f172a;box-shadow:0 1px 4px #0002}
.fl{display:flex;flex-direction:column;gap:.5vw}.fl>label{font-size:1.1vw;font-weight:700;color:#475569}
.ti{font-size:1.6vw;padding:.9vw 1.1vw;border:.15vw solid #cbd5e1;border-radius:.8vw;width:100%;min-height:4vw;font-family:inherit;color:#0f172a;background:#fff}
.ti:focus{outline:none;border-color:#2563eb}
.chips{display:flex;flex-wrap:wrap;gap:.6vw}
.chip{border:.15vw solid #cbd5e1;background:#f8fafc;color:#0f172a;font-size:1.3vw;font-weight:600;padding:.7vw 1.3vw;border-radius:2.5vw;cursor:pointer;min-height:3.6vw;display:flex;align-items:center;gap:.6vw}
.chip.on{background:var(--c,#2563eb);border-color:var(--c,#2563eb);color:#fff}
.chip i{width:1.3vw;height:1.3vw;border-radius:50%;background:var(--c,#64748b);border:.12vw solid #fff}
.row2{display:flex;gap:1vw;align-items:flex-end}.row2 .fl{flex:1}
.amf{display:flex;gap:1vw;align-items:center;margin-top:.4vw}.amf .msg{margin-right:auto;font-size:1.2vw;color:#dc2626}.amf .msg.ok{color:#15803d}
.btn{border:0;border-radius:.9vw;font-size:1.6vw;font-weight:800;padding:1vw 2.4vw;cursor:pointer;min-height:4.2vw}.btn.pri{background:#2563eb;color:#fff}.btn.sec{background:#f1f5f9;color:#334155}.btn:disabled{opacity:.45}
.stp{display:flex;align-items:center;gap:.6vw}.stp button{width:4vw;height:4vw;font-size:2vw;border:0;border-radius:.8vw;background:#f1f5f9;cursor:pointer}.stp b{font-size:1.7vw;min-width:5vw;text-align:center}
.hide{display:none!important}
.foot{position:fixed;bottom:.3vw;right:1.6vw;font-size:.7vw;color:#94a3b8}.foot.err{color:#dc2626}
</style></head><body>
<div class="top"><div class="time" id="time">--:--</div><div class="date" id="date"></div>
<div class="hchips" id="hchips"></div><button class="addb" id="addb">+ Add</button><!-- reserved: Home Assistant status chips -->
<div class="wx" id="wx"><span class="ic">·</span><span>Loading weather…</span></div></div>
<div class="main">
 <div class="cal">
  <div class="bar"><button class="nav" id="prev">‹</button><h2 id="range"></h2><button class="nav" id="next">›</button><button class="nav tb" id="todayb">Today</button>
   <div class="pfs" id="pfs"></div>
   <div class="tg" id="tg"><button data-v="day">Day</button><button data-v="week" class="on">Week</button><button data-v="month">Month</button></div></div>
  <div id="wkh"></div>
  <div class="grid week" id="grid"></div>
 </div>
 <div class="side">
  <div class="ch" id="chp"><h3>Chores · Today <small id="chmsg">tap to check off</small></h3><div class="kids" id="kids"><div class="empty">Loading…</div></div></div>
  <div class="up"><h3>Up next · Today</h3><div id="agenda"></div></div>
 </div>
</div>
<div class="foot" id="foot"></div>
<div id="night"><div class="nt" id="ntime"></div><div class="nd" id="ndate"></div></div>
<div class="ov" id="ov"><div class="lbl" id="ovlbl">Someone's at the front door</div><div class="box" id="ovbox"><span class="live">● LIVE</span></div><div class="hint">Tap anywhere to close</div></div>
<div id="am"><div class="amb">
 <div class="amh"><h2 id="amt">Add</h2><div class="seg" id="amk"><button data-k="event" class="on">📅 Event</button><button data-k="task">✅ Task</button></div><button class="amx" id="amx">×</button></div>
 <div class="fl"><label>Title</label><input class="ti" id="aTitle" maxlength="120" autocomplete="off" placeholder="What is it?"></div>
 <div class="fl"><label id="aWhoL">For</label><div class="chips" id="aWho"></div></div>
 <div class="fl"><label>Date</label><div class="chips" id="aDays"></div></div>
 <div id="evOnly" class="fl"><label>Time</label><div class="row2"><div class="chips"><button class="chip on" id="aAll">All day</button><button class="chip" id="aTimed">Set time</button></div>
  <div class="fl" id="aTimes"><div class="row2"><div class="fl"><label>Start</label><input class="ti" type="time" id="aStart" value="09:00"></div><div class="fl"><label>End</label><input class="ti" type="time" id="aEnd" value="10:00"></div></div></div></div></div>
 <div id="tkOnly" class="row2 hide"><div class="fl"><label>Stars (optional)</label><div class="stp"><button id="sMinus">−</button><b id="sVal">0 ⭐</b><button id="sPlus">+</button></div></div>
  <div class="fl"><label>Time (optional, reminder)</label><div class="row2"><input class="ti" type="time" id="aTkTime"><button class="chip" id="aTkClr">No time</button></div></div></div>
 <div class="amf"><span class="msg" id="aMsg"></span><button class="btn sec" id="aCancel">Cancel</button><button class="btn pri" id="aSave">Add event</button></div>
</div></div>
<script>
const TZ='America/Chicago', REFRESH=5*60*1000;
let cfg={people:[],camera:{}}, view='week', anchor=today(), cache={}, hidden=new Set(), lastOk=null;
const $=id=>document.getElementById(id);
function partsInTZ(d){const o={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o}
function today(){const p=partsInTZ(new Date());return `${p.year}-${p.month}-${p.day}`}
function nowHM(){const p=partsInTZ(new Date());return `${p.hour}:${p.minute}`}
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dow=s=>D(s).getUTCDay();
const fmt=(s,o)=>D(s).toLocaleDateString('en-US',{timeZone:'UTC',...o});
function t12(hm,ampm){let [h,m]=hm.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return (m?`${h}:${String(m).padStart(2,'0')}`:`${h}:00`)+(ampm?' '+ap:ap[0].toLowerCase())}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function color(names){const p=cfg.people.find(p=>p.name===names[0]);return p?p.color:'#64748b'}

let curDay=today();
function tick(){const d=new Date();const nd=today();
 if(nd!==curDay){if(anchor===curDay)anchor=nd;curDay=nd;cache={};load(true)} // roll over at midnight (America/Chicago)
 $('time').textContent=d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
 $('date').textContent=d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const t=today(); if(t!==tick.last){if(tick.last&&anchor===tick.last)anchor=t;tick.last=t;render()}
 if(d.getSeconds()===0)renderAgenda();}

function rangeFor(){if(view==='day')return [anchor,anchor];
 if(view==='week')return [anchor,add(anchor,6)]; // rolling 7 days starting at anchor (today by default)
 const f=anchor.slice(0,8)+'01',s=add(f,-dow(f));return [s,add(s,41)]}

async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()}
async function load(force){const [s,e]=rangeFor(),t=today();const want=[[s,e],[t,t]];
 try{for(const [a,b] of want){const k=a+'|'+b;if(force||!cache[k])cache[k]=(await getJSON(`api/events?start=${a}&end=${b}`)).events}
  lastOk=new Date();$('foot').className='foot';$('foot').textContent='Updated '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}
 catch(err){$('foot').className='foot err';$('foot').textContent='Calendar unavailable ('+err.message+')'+(lastOk?' · showing data from '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}):'')}
 render()}

function eventsOn(list,day){return list.filter(e=>!e.people.length||e.people.some(p=>!hidden.has(p))).filter(e=>e.allDay?(e.start<=day&&e.end>=day):e.start.slice(0,10)===day)}
function evHTML(e){const c=color(e.people);const who=e.people.join(', ');
 return e.allDay?`<div class="ev ad" style="--c:${c}">${esc(e.title)}<span class="who">${esc(who)}</span></div>`
 :`<div class="ev" style="--c:${c}"><b>${t12(e.start.slice(11,16),view==='day')}</b> ${esc(e.title)}<span class="who">${esc(who)}</span></div>`}

function render(){const [s,e]=rangeFor(),list=cache[s+'|'+e];const t=today(),g=$('grid');
 g.className='grid '+(view==='day'?'dayv':view);
 $('range').textContent=view==='day'?fmt(s,{weekday:'short',month:'short',day:'numeric'}):view==='week'?(fmt(s,{month:'short',day:'numeric'})+' – '+(s.slice(5,7)===e.slice(5,7)?fmt(e,{day:'numeric'}):fmt(e,{month:'short',day:'numeric'}))):fmt(anchor,{month:'long',year:'numeric'});
 $('wkh').className=view==='month'?'wkh':'';$('wkh').innerHTML=view==='month'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join(''):'';
 if(!list){g.innerHTML='<div class="empty">Loading…</div>';return}
 const n=view==='day'?1:view==='week'?7:42;let h='';
 for(let i=0;i<n;i++){const d=add(s,i),evs=eventsOn(list,d);const other=view==='month'&&d.slice(5,7)!==anchor.slice(5,7);
  h+=`<div class="day${d===t?' today':''}${other?' other':''}"><div class="dh"><span>${fmt(d,{weekday:view==='day'?'long':'short'})}</span>${view!=='month'?dayWx(d):''}<strong>${fmt(d,{day:'numeric'})}</strong></div><div class="evs">${evs.map(evHTML).join('')||(view==='day'?'<div class="empty">Nothing scheduled</div>':'')}</div></div>`}
 if(view==='week'){const cnt={};let tot=0;for(let i=0;i<7;i++)for(const ev of eventsOn(list,add(s,i))){tot++;for(const p of (ev.people.length?ev.people:['Family']))cnt[p]=(cnt[p]||0)+1}
  h+=`<div class="day sum"><div class="dh"><span>Next 7 days</span><strong>${tot}</strong></div><div class="evs">${cfg.people.filter(p=>cnt[p.name]).map(p=>`<div class="row"><i style="background:${p.color}"></i>${esc(p.name)}<b>${cnt[p.name]}</b></div>`).join('')||'<div class="empty">Nothing scheduled</div>'}</div></div>`}
 g.innerHTML=h;
 g.querySelectorAll('.day').forEach(d=>{const v=d.querySelector('.evs');if(v&&v.scrollHeight>v.clientHeight+2)d.classList.add('more')});
 renderAgenda()}

function renderAgenda(){const t=today(),list=cache[t+'|'+t];if(!list)return;const now=nowHM();
 const evs=eventsOn(list,t);const ad=evs.filter(e=>e.allDay),timed=evs.filter(e=>!e.allDay).filter(e=>e.end.slice(0,10)>t||e.end.slice(11,16)>now);
 $('agenda').style.cssText='display:flex;flex-direction:column;gap:.6vw';
 $('agenda').innerHTML=ad.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>All day</b><span>${esc(e.title)}</span></div>`).join('')+
  timed.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>${e.start.slice(11,16)<=now?'Now':t12(e.start.slice(11,16),true)}</b><span>${esc(e.title)}</span></div>`).join('')||'<div class="empty">Nothing else today 🎉</div>'}

function renderPeople(){$('pfs').innerHTML=cfg.people.map(p=>`<button class="pf${hidden.has(p.name)?' off':''}" data-n="${esc(p.name)}"><i style="background:${p.color}">${esc(p.initial)}</i>${esc(p.name)}</button>`).join('')}
$('pfs').onclick=e=>{const b=e.target.closest('.pf');if(!b)return;const n=b.dataset.n;hidden.has(n)?hidden.delete(n):hidden.add(n);renderPeople();render()};
$('tg').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('tg').children].forEach(x=>x.classList.toggle('on',x===b));anchor=today();load()};
$('prev').onclick=()=>{anchor=view==='day'?add(anchor,-1):view==='week'?add(anchor,-7):add(anchor.slice(0,8)+'01',-1);load()};
$('todayb').onclick=()=>{anchor=today();load()};
$('next').onclick=()=>{anchor=view==='day'?add(anchor,1):view==='week'?add(anchor,7):add(add(anchor.slice(0,8)+'01',32).slice(0,8)+'01',0);load()};

// ---------------------------------------------------------------- + Add (event / task)
let addKind='event',addDay=null,addWho=[],addAllDay=true,addStars=0,addBusy=false;
function addOpen(){addKind='event';addDay=today();addWho=[];addAllDay=true;addStars=0;$('aTitle').value='';$('aTkTime').value='';$('aMsg').textContent='';$('aMsg').className='msg';
 const p=partsInTZ(new Date()),h=Math.min(22,(+p.hour)+1);$('aStart').value=String(h).padStart(2,'0')+':00';$('aEnd').value=String(h+1).padStart(2,'0')+':00';
 addRender();$('am').classList.add('on')}
function addClose(){$('am').classList.remove('on');if(document.activeElement)document.activeElement.blur()}
function addRender(){const ev=addKind==='event';
 [...$('amk').children].forEach(b=>b.classList.toggle('on',b.dataset.k===addKind));
 $('amt').textContent=ev?'Add event':'Add task';$('aSave').textContent=ev?'Add event':'Add task';
 $('aWhoL').textContent=ev?'For (tap one or more)':'For (tap one or more · one chore each)';
 $('evOnly').classList.toggle('hide',!ev);$('tkOnly').classList.toggle('hide',ev);
 const ps=cfg.addPeople||[];
 $('aWho').innerHTML=ps.map(p=>`<button class="chip${addWho.indexOf(p.id)>=0?' on':''}" style="--c:${p.color}" data-id="${esc(p.id)}"><i></i>${esc(p.name)}</button>`).join('')+
  (ps.some(p=>p.name==='Jack')&&ps.some(p=>p.name==='Liv')?'<button class="chip" data-kids="1">👧👦 Both kids</button>':'')||'<span class="empty">No profiles</span>';
 let dh='';for(let i=0;i<7;i++){const d=add(today(),i);dh+=`<button class="chip${d===addDay?' on':''}" data-d="${d}">${i===0?'Today':i===1?'Tomorrow':fmt(d,{weekday:'short',month:'short',day:'numeric'})}</button>`}
 const other=addDay>add(today(),6)||addDay<today();
 $('aDays').innerHTML=dh+`<input class="ti" type="date" id="aDate" style="width:auto;min-height:3.6vw;font-size:1.3vw${other?';border-color:#2563eb':''}" value="${addDay}">`;
 $('aDate').onchange=e=>{if(e.target.value){addDay=e.target.value;addRender()}};
 $('aAll').classList.toggle('on',addAllDay);$('aTimed').classList.toggle('on',!addAllDay);$('aTimes').classList.toggle('hide',addAllDay);
 $('sVal').textContent=addStars+' ⭐'}
$('addb').onclick=addOpen;$('amx').onclick=addClose;$('aCancel').onclick=addClose;
$('am').onclick=e=>{if(e.target===$('am'))addClose()};
$('amk').onclick=e=>{const b=e.target.closest('button');if(!b)return;addKind=b.dataset.k;addRender()};
$('aWho').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ps=cfg.addPeople||[];
 if(b.dataset.kids){const ids=ps.filter(p=>p.name==='Jack'||p.name==='Liv').map(p=>p.id);const all=ids.every(i=>addWho.indexOf(i)>=0);
  addWho=addWho.filter(i=>ids.indexOf(i)<0);if(!all)addWho=addWho.concat(ids)}
 else{const id=b.dataset.id,k=addWho.indexOf(id);if(k>=0)addWho.splice(k,1);else addWho.push(id)}addRender()};
$('aDays').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;addDay=b.dataset.d;addRender()};
$('aAll').onclick=()=>{addAllDay=true;addRender()};$('aTimed').onclick=()=>{addAllDay=false;addRender()};
$('aStart').onchange=()=>{const s=$('aStart').value;if(s&&$('aEnd').value<=s){const h=Math.min(23,+s.slice(0,2)+1);$('aEnd').value=(h===+s.slice(0,2)?'23:59':String(h).padStart(2,'0')+s.slice(2))}};
$('sMinus').onclick=()=>{addStars=Math.max(0,addStars-1);addRender()};$('sPlus').onclick=()=>{addStars=Math.min(20,addStars+1);addRender()};
$('aTkClr').onclick=()=>{$('aTkTime').value=''};
$('aSave').onclick=async()=>{if(addBusy)return;const m=$('aMsg');m.className='msg';
 const title=$('aTitle').value.trim();if(!title){m.textContent='Add a title';return}
 if(!addWho.length){m.textContent='Pick who it\'s for';return}
 let url,body;if(addKind==='event'){url='api/events/create';body={title:title,date:addDay,allDay:addAllDay,profiles:addWho};
  if(!addAllDay){body.start=$('aStart').value;body.end=$('aEnd').value;if(!body.start||!body.end||body.end<=body.start){m.textContent='End must be after start';return}}}
 else{url='api/chores/create';body={title:title,date:addDay,profiles:addWho,stars:addStars};if($('aTkTime').value)body.time=$('aTkTime').value}
 addBusy=true;$('aSave').disabled=true;m.textContent='Saving…';m.className='msg ok';
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(x){}throw new Error(d||r.status)}
  m.textContent='Added ✓';cache={};load(true);loadChores();setTimeout(addClose,700)}
 catch(err){m.className='msg';m.textContent='Could not save: '+err.message}
 finally{addBusy=false;$('aSave').disabled=false}};

let ovTimer=null,seenRing=undefined;
const camHost=u=>(u||'').replace('{host}',location.hostname);
function openCam(ring){const c=cfg.camera||{};if(!c.url)return;
 $('ovlbl').textContent=ring?"Someone's at the front door":(c.name||'Camera');
 if(!$('ovbox').querySelector('iframe')){const f=document.createElement('iframe');f.src=camHost(c.url);f.allow='autoplay; fullscreen';
  f.setAttribute('scrolling','no');f.setAttribute('frameborder','0');f.style.pointerEvents='none';$('ovbox').prepend(f)}
 wake(120000);$('ov').classList.add('on');clearTimeout(ovTimer);ovTimer=setTimeout(closeCam,60000)}
function closeCam(){clearTimeout(ovTimer);$('ov').classList.remove('on');const f=$('ovbox').querySelector('iframe');if(f)f.remove()}
function setupCamera(){if(location.hash==='#ring')openCam(true)} // demo: /dashboard/#ring (no stream is loaded until a ring)
$('ov').onclick=closeCam;
async function pollRing(){try{const d=await getJSON('api/doorbell');
  if(seenRing===undefined)seenRing=d.last_ring;
  else if(d.last_ring&&d.last_ring!==seenRing){seenRing=d.last_ring;openCam(true)}}catch(e){}}
setInterval(pollRing,2000);

let wxDays={};
function dayWx(d){const w=wxDays[d];if(!w)return '';const hl=[w.hi,w.lo].filter(x=>x!==null&&x!==undefined).map(x=>x+'°').join(' / ');return `<span class="dw">${w.icon||''} ${hl}</span>`}
async function weather(){try{const d=await getJSON('api/weather');wxDays={};(d.days||[]).forEach(x=>wxDays[x.date]=x);
  const c=d.current||{},t=wxDays[today()]||{};const hl=(t.hi!=null?'H '+t.hi+'° ':'')+(t.lo!=null?'L '+t.lo+'°':'');
  $('wx').innerHTML=`<span class="ic">${c.icon||'🌡️'}</span><b>${c.temp!=null?c.temp+'°F':'--'}</b> ${esc(c.text||'')} <span class="hl">${hl}</span>`;render()}
 catch(e){$('wx').innerHTML='<span class="ic">🌡️</span><span>Weather unavailable</span>'}}

async function loadHome(){try{const d=await getJSON('api/home');$('hchips').innerHTML=(d.chips||[]).map(c=>`<span class="hc ${c.level}" title="${esc(c.id)}">${c.icon} ${esc(c.name)} · ${esc(c.label)}</span>`).join('')}catch(e){}}
let chData=null,chBusy=false;
async function loadChores(){try{chData=await getJSON('api/chores');renderChores()}catch(e){if(!chData)$('kids').innerHTML='<div class="empty">Chores unavailable</div>'}}
function renderChores(){if(!chData)return;const ks=chData.kids||[];
 $('kids').innerHTML=ks.map(k=>`<div class="kid" style="--c:${k.color}"><div class="kh"><i style="background:${k.color}"></i>${esc(k.name)}<span class="st">⭐ ${k.stars}</span></div>`+
  (k.chores.length?k.chores.map(c=>`<button class="cb${c.done?' done':''}${c.tappable?'':' ro'}" data-id="${c.id}" data-ro="${c.tappable?0:1}"><span class="bx">${c.done?'✓':''}</span><span class="tt">${esc(c.title)}</span>${c.stars?`<span class="sv">+${c.stars}⭐</span>`:''}</button>`).join(''):'<div class="empty">No chores today</div>')+'</div>').join('')||'<div class="empty">No chores today</div>'}
$('kids').onclick=async e=>{const b=e.target.closest('.cb');if(!b||chBusy)return;
 if(b.dataset.ro==='1'){$('chmsg').textContent='repeating chore: check off in the eCalendar app';setTimeout(()=>$('chmsg').textContent='tap to check off',5000);return}
 chBusy=true;b.classList.add('busy');
 try{const r=await fetch('api/chores/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:b.dataset.id})});
  if(!r.ok)throw new Error(r.status);const d=await r.json();chData={day:d.day,kids:d.kids};renderChores()}
 catch(err){b.classList.remove('busy');$('chmsg').textContent='could not save ('+err.message+')'}
 finally{chBusy=false}};

// night dim: near-black overlay between cfg.night.start and end (America/Chicago); tap or doorbell wakes for 2 min
let wakeUntil=0;
const toMin=s=>{const a=String(s||'0:0').split(':');return (+a[0])*60+(+a[1]||0)};
function isNight(){const n=cfg.night||{start:'21:00',end:'06:00'},p=partsInTZ(new Date()),m=(+p.hour)*60+(+p.minute),a=toMin(n.start),b=toMin(n.end);
 if(location.hash==='#night')return true;return a<=b?(m>=a&&m<b):(m>=a||m<b)}
function wake(ms){wakeUntil=Date.now()+(ms||120000);nightTick()}
function nightTick(){const on=isNight()&&Date.now()>wakeUntil&&!$('ov').classList.contains('on');$('night').classList.toggle('on',on);
 if(on){const d=new Date();$('ntime').textContent=d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});$('ndate').textContent=d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'})}}
$('night').addEventListener('click',e=>{e.stopPropagation();wake(120000)});
document.addEventListener('touchstart',()=>{if(!$('night').classList.contains('on')&&isNight())wake(120000)},{passive:true});
setInterval(nightTick,1000);

(async()=>{tick();setInterval(tick,1000);
 try{cfg=await getJSON('api/config')}catch(e){$('foot').className='foot err';$('foot').textContent='Config unavailable'}
 renderPeople();setupCamera();nightTick();weather();loadChores();loadHome();await load();
 setInterval(()=>{cache={};load(true)},REFRESH);setInterval(weather,15*60*1000);setInterval(loadChores,60000);setInterval(loadHome,15000);
 setInterval(()=>location.reload(),6*3600*1000);})();
</script></body></html>
