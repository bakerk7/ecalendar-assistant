.row2>*+*{margin-left:1vw}.amf>*+*{margin-left:1vw}.amf>.msg{margin-right:auto}.stp>*+*{margin-left:.6vw}

#night .nt{color:#4a3a5c;font-weight:300}#night .nd{color:#2c2338}

.amh h2{font-weight:800;color:#2d2a3e}
.seg .on{color:#ff7a59}

 <div id="tkOnly" class="row2 hide"><div class="fl"><label>Stars (optional)</label><div class="stp"><button id="sMinus">−</button><b id="sVal">0 ⭐</b><button id="sPlus">+</button></div></div>
  <div class="fl"><label>Time (optional, reminder)</label><div class="row2"><input class="ti" type="time" id="aTkTime"><button class="chip" id="aTkClr">No time</button></div></div></div>
 <div class="amf"><span class="msg" id="aMsg"></span><button class="btn sec" id="aCancel">Cancel</button><button class="btn pri" id="aSave">Add event</button></div>
</div></div>
<script>
const TZ='America/Chicago', REFRESH=5*60*1000;
let cfg={people:[],camera:{}}, view='week', anchor=today(), cache={}, hidden=new Set(), lastOk=null;
const $=id=>document.getElementById(id);
function partsInTZ(d){const o={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);
 // Chromium 74 (V8 7.4) ignores hourCycle and returns 12h hour + dayPeriod; normalize to 00-23
 let h=+o.hour%12;if(o.dayPeriod){if(/p/i.test(o.dayPeriod))h+=12}else h=+o.hour%24;o.hour=(h<10?'0':'')+h;return o}
function today(){const p=partsInTZ(new Date());return `${p.year}-${p.month}-${p.day}`}
function nowHM(){const p=partsInTZ(new Date());return `${p.hour}:${p.minute}`}
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dow=s=>D(s).getUTCDay();
const fmt=(s,o)=>D(s).toLocaleDateString('en-US',{timeZone:'UTC',...o});
function t12(hm,ampm){let [h,m]=hm.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return (m?`${h}:${String(m).padStart(2,'0')}`:`${h}:00`)+(ampm?' '+ap:ap[0].toLowerCase())}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL={Jack:'#5b9be6',Liv:'#a978e3',Mom:'#5fb884',Dad:'#e2786c',Bruce:'#eb9a45',Family:'#7d8ca3'};
const TINT={Jack:'#dde9f9',Liv:'#ece0fa',Mom:'#d9efe1',Dad:'#f8dbd7',Bruce:'#fce8d2',Family:'#e6eaf0'};
const pc=p=>PAL[p.name]||p.color;
const ini=n=>(n||'?').charAt(0).toUpperCase();
function color(names){const p=cfg.people.find(p=>p.name===names[0]);return p?pc(p):PAL.Family}

let curDay=today();
function tick(){const d=new Date();const nd=today();
 if(nd!==curDay){if(anchor===curDay)anchor=nd;curDay=nd;cache={};load(true)} // roll over at midnight (America/Chicago)
 $('time').textContent=d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
 $('date').textContent=d.toLocaleDateString('en-US',{timeZone:TZ,month:'short',day:'numeric',year:'numeric'}).replace(',','');
 const t=today(); if(t!==tick.last){if(tick.last&&anchor===tick.last)anchor=t;tick.last=t;render()}
 if(d.getSeconds()===0)renderAgenda();}

function rangeFor(){if(view==='day')return [anchor,anchor];
 if(view==='week')return [anchor,add(anchor,6)]; // rolling 7 days starting at anchor (today by default)
 const f=anchor.slice(0,8)+'01',s=add(f,-dow(f));return [s,add(s,41)]}

async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()}
async function load(force){const [s,e]=rangeFor(),t=today();const want=[[s,e],[t,t]];
 try{for(const [a,b] of want){const k=a+'|'+b;if(force||!cache[k])cache[k]=(await getJSON(`api/events?start=${a}&end=${b}`)).events}
  lastOk=new Date();$('foot').className='foot';$('wifi').className='wifi';$('foot').textContent='Updated '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}
 catch(err){$('foot').className='foot err';$('wifi').className='wifi err';$('foot').textContent='Calendar unavailable ('+err.message+')'+(lastOk?' · showing data from '+lastOk.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}):'')}
 render()}

function eventsOn(list,day){return list.filter(e=>!e.people.length||e.people.some(p=>!hidden.has(p))).filter(e=>e.allDay?(e.start<=day&&e.end>=day):e.start.slice(0,10)===day)}
let chData=null,chBusy=false;let doneSet={};try{doneSet=JSON.parse(localStorage.getItem('evdone')||'{}')}catch(x){}
const evKey=e=>e.title+'|'+e.start;
function avHTML(ps){const ns=ps.length?ps:['Family'];return '<span class="av">'+ns.slice(0,3).map(n=>{const p=cfg.people.find(q=>q.name===n);return `<i style="background:${p?pc(p):PAL.Family}">${ini(n)}</i>`}).join('')+'</span>'}
function evHTML(e,nx){const c=color(e.people),tn=TINT[e.people[0]]||TINT.Family,k=evKey(e),dn=doneSet[k]?' dn':'';
 const sub=e.allDay?'All day':(t12(e.start.slice(11,16),false).replace(/([ap])$/,' $1m').toUpperCase().replace(' AM',' AM')+' – '+t12(e.end.slice(11,16),false).replace(/([ap])$/,' $1m').toUpperCase());
 return `<div class="ev${nx?' nx':''}${dn}" style="--c:${c};--t:${tn}" data-k="${esc(k)}"><span class="tx"><span class="tl">${nx?`<em class="nxb">${nx}</em>`:''}${esc(e.title)}</span><span class="sb">${sub}</span></span>${avHTML(e.people)}<button class="ck">${dn?'✓':''}</button></div>`}
function dayBody(d,evs,t){const now=nowHM();
 if(!evs.length)return view==='month'?'':'<div class="noev">No event</div>';
 let nxi=-1;if(d===t&&view!=='month')for(let i=0;i<evs.length;i++){const e=evs[i];if(!e.allDay&&(e.end.slice(0,10)>t||e.end.slice(11,16)>now)){nxi=i;break}}
 if(nxi<0)return evs.map(e=>evHTML(e)).join('');
 const past=evs.filter(e=>!e.allDay&&e.end.slice(0,10)===t&&e.end.slice(11,16)<=now);
 return evs.map(e=>past.indexOf(e)>=0?evHTML(e).replace('class="ev','class="ev pastev'):evHTML(e,e===evs[nxi]?(e.start.slice(11,16)<=now?'Now':'Next'):'')).join('')}
function render(){const [s,e]=rangeFor(),list=cache[s+'|'+e];const t=today(),g=$('grid');
 g.className='grid '+(view==='day'?'dayv':view);$('vsel').value=view;
 $('range').textContent=view==='day'?fmt(s,{month:'short',day:'2-digit'}):view==='week'?(fmt(s,{month:'short',day:'2-digit'})+'-'+fmt(e,{day:'2-digit'})):fmt(anchor,{month:'short',year:'numeric'});
 $('wkh').className=view==='month'?'wkh':'';$('wkh').innerHTML=view==='month'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join(''):'';
 [...$('rail').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.r===view&&!$('chp').classList.contains('on')||($('chp').classList.contains('on')&&b.dataset.r===chMode)));
 if(!list){g.innerHTML='<div class="empty">Loading…</div>';return}
 const n=view==='day'?1:view==='week'?7:42;let h='';
 for(let i=0;i<n;i++){const d=add(s,i),evs=eventsOn(list,d);const other=view==='month'&&d.slice(5,7)!==anchor.slice(5,7);
  const lbl=view==='month'?`<span class="dn"><b>${fmt(d,{day:'numeric'})}</b></span>`:`<span class="dn">${fmt(d,{weekday:view==='day'?'long':'short'})}<b>${fmt(d,{day:'2-digit'})}</b></span>`;
  const ac=view==='month'?'':`<button class="ac" data-d="${d}">${evs.length?evs.length+(evs.length===1?' event':' events'):'Add Event'}<em>+</em></button>`;
  h+=`<div class="day${d===t?' today':''}${other?' other':''}"><div class="dh">${lbl}${view==='day'?dayWx(d):''}${ac}</div><div class="evs">${dayBody(d,evs,t)}</div></div>`}
 if(view==='week'){const ns=add(s,7);h+=`<div class="day nxw" id="nxw"><div class="dh"><span class="dn">Next Week</span></div><div class="evs"><div class="noev">${fmt(ns,{month:'short',day:'2-digit'})}-${fmt(add(ns,6),{month:'short',day:'2-digit'})}</div></div></div>`}
 g.innerHTML=h;
 g.querySelectorAll('.day').forEach(d=>{const v=d.querySelector('.evs');if(v&&v.scrollHeight>v.clientHeight+2)d.classList.add('more')});
 renderMembers();renderAgenda()}
$('grid').onclick=e=>{const ck=e.target.closest('.ck');if(ck){const ev=ck.closest('.ev'),k=ev.dataset.k;if(doneSet[k])delete doneSet[k];else doneSet[k]=1;try{localStorage.setItem('evdone',JSON.stringify(doneSet))}catch(x){}render();return}
 const ac=e.target.closest('.ac');if(ac){addOpen();addDay=ac.dataset.d;addRender();return}
 if(e.target.closest('#nxw')){anchor=add(anchor,7);load();return}
 const dy=e.target.closest('.day');if(dy&&view==='month'){const b=dy.querySelector('.ac');}};
function renderAgenda(){const t=today(),list=cache[t+'|'+t];if(!list)return;const now=nowHM();
 const evs=eventsOn(list,t);const ad=evs.filter(e=>e.allDay),timed=evs.filter(e=>!e.allDay).filter(e=>e.end.slice(0,10)>t||e.end.slice(11,16)>now);
 $('agenda').className='agl';
 $('agenda').innerHTML=ad.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>All day</b><span>${esc(e.title)}</span></div>`).join('')+
  timed.map(e=>`<div class="ag" style="--c:${color(e.people)}"><b>${e.start.slice(11,16)<=now?'Now':t12(e.start.slice(11,16),true)}</b><span>${esc(e.title)}</span></div>`).join('')||'<div class="empty">Nothing else today 🎉</div>'}

function renderPeople(){$('pfs').innerHTML=cfg.people.map(p=>`<button class="pf${hidden.has(p.name)?' off':''}" data-n="${esc(p.name)}"><i style="background:${pc(p)}">${esc(p.initial||ini(p.name))}</i>${esc(p.name)}</button>`).join('');$('fltb').classList.toggle('on',hidden.size>0);renderMembers()}
function renderMembers(){const ks=(chData&&chData.kids)||[];
 $('mem').innerHTML=cfg.people.map(p=>{const k=ks.find(x=>x.name===p.name),dn=k?k.chores.filter(c=>c.done).length:0,tot=k?k.chores.length:0;
  return `<button class="mc${hidden.has(p.name)?' off':''}" style="--c:${pc(p)};--t:${TINT[p.name]||TINT.Family}" data-n="${esc(p.name)}"><i>${esc(p.initial||ini(p.name))}</i><span>${esc(p.name)}</span><b>${dn}/${tot}</b></button>`}).join('')}
function toggleP(n){hidden.has(n)?hidden.delete(n):hidden.add(n);renderPeople();render()}
$('pfs').onclick=e=>{e.stopPropagation();const b=e.target.closest('.pf');if(b)toggleP(b.dataset.n)};
$('mem').onclick=e=>{const b=e.target.closest('.mc');if(b)toggleP(b.dataset.n)};
$('fltb').onclick=()=>$('pfs').classList.toggle('on');
function setView(v){view=v;anchor=today();load()}
$('vsel').onchange=()=>setView($('vsel').value);
$('prev').onclick=()=>{anchor=view==='day'?add(anchor,-1):view==='week'?add(anchor,-7):add(anchor.slice(0,8)+'01',-1);load()};
$('todayb').onclick=$('range').onclick=()=>{anchor=today();load()};
$('next').onclick=()=>{anchor=view==='day'?add(anchor,1):view==='week'?add(anchor,7):add(add(anchor.slice(0,8)+'01',32).slice(0,8)+'01',0);load()};
$('refb').onclick=()=>{cache={};load(true);weather();loadChores();loadHome()};
let chMode='chores';
function drawer(m){chMode=m;$('chh').textContent=m==='stars'?'Stars · Today':'Chores · Today';$('chp').classList.add('on');render()}
$('chx').onclick=()=>{$('chp').classList.remove('on');render()};
$('rail').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=b.dataset.r;
 if(r==='chores'||r==='stars'){if($('chp').classList.contains('on')&&chMode===r){$('chp').classList.remove('on');render()}else drawer(r);return}
 if(r==='cam'){openCam(false);return}
 if(r==='night'){forceNight=true;wakeUntil=0;nightTick();return}
 if(r==='add'){addOpen();return}
 $('chp').classList.remove('on');setView(r)};

// ---------------------------------------------------------------- + Add (event / task)
let addKind='event',addDay=null,addWho=[],addAllDay=true,addStars=0,addBusy=false;
function addOpen(){addKind='event';addDay=today();addWho=[];addAllDay=true;addStars=0;$('aTitle').value='';$('aTkTime').value='';$('aMsg').textContent='';$('aMsg').className='msg';
 const p=partsInTZ(new Date()),h=Math.min(22,(+p.hour)+1);$('aStart').value=String(h).padStart(2,'0')+':00';$('aEnd').value=String(h+1).padStart(2,'0')+':00';
 addRender();$('am').classList.add('on')}
function addClose(){$('am').classList.remove('on');if(document.activeElement)document.activeElement.blur()}
function addRender(){const ev=addKind==='event';
 [...$('amk').children].forEach(b=>b.classList.toggle('on',b.dataset.k===addKind));
 $('amt').textContent=ev?'Add event':'Add task';$('aSave').textContent=ev?'Add event':'Add task';
 $('aWhoL').textContent=ev?'For (tap one or more)':'For (tap one or more · one chore each)';
 $('evOnly').classList.toggle('hide',!ev);$('tkOnly').classList.toggle('hide',ev);
 const ps=cfg.addPeople||[];
 $('aWho').innerHTML=ps.map(p=>`<button class="chip${addWho.indexOf(p.id)>=0?' on':''}" style="--c:${pc(p)}" data-id="${esc(p.id)}"><i></i>${esc(p.name)}</button>`).join('')+
  (ps.some(p=>p.name==='Jack')&&ps.some(p=>p.name==='Liv')?'<button class="chip" data-kids="1">👧👦 Both kids</button>':'')||'<span class="empty">No profiles</span>';
 let dh='';for(let i=0;i<7;i++){const d=add(today(),i);dh+=`<button class="chip${d===addDay?' on':''}" data-d="${d}">${i===0?'Today':i===1?'Tomorrow':fmt(d,{weekday:'short',month:'short',day:'numeric'})}</button>`}
 const other=addDay>add(today(),6)||addDay<today();
 $('aDays').innerHTML=dh+`<input class="ti" type="date" id="aDate" style="width:auto;min-height:3.6vw;font-size:1.3vw${other?';border-color:#2563eb':''}" value="${addDay}">`;
 $('aDate').onchange=e=>{if(e.target.value){addDay=e.target.value;addRender()}};
 $('aAll').classList.toggle('on',addAllDay);$('aTimed').classList.toggle('on',!addAllDay);$('aTimes').classList.toggle('hide',addAllDay);
 $('sVal').textContent=addStars+' ⭐'}
$('addb').onclick=addOpen;$('amx').onclick=addClose;$('aCancel').onclick=addClose;
$('am').onclick=e=>{if(e.target===$('am'))addClose()};
$('amk').onclick=e=>{const b=e.target.closest('button');if(!b)return;addKind=b.dataset.k;addRender()};
$('aWho').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ps=cfg.addPeople||[];
 if(b.dataset.kids){const ids=ps.filter(p=>p.name==='Jack'||p.name==='Liv').map(p=>p.id);const all=ids.every(i=>addWho.indexOf(i)>=0);
  addWho=addWho.filter(i=>ids.indexOf(i)<0);if(!all)addWho=addWho.concat(ids)}
 else{const id=b.dataset.id,k=addWho.indexOf(id);if(k>=0)addWho.splice(k,1);else addWho.push(id)}addRender()};
$('aDays').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;addDay=b.dataset.d;addRender()};
$('aAll').onclick=()=>{addAllDay=true;addRender()};$('aTimed').onclick=()=>{addAllDay=false;addRender()};
$('aStart').onchange=()=>{const s=$('aStart').value;if(s&&$('aEnd').value<=s){const h=Math.min(23,+s.slice(0,2)+1);$('aEnd').value=(h===+s.slice(0,2)?'23:59':String(h).padStart(2,'0')+s.slice(2))}};
$('sMinus').onclick=()=>{addStars=Math.max(0,addStars-1);addRender()};$('sPlus').onclick=()=>{addStars=Math.min(20,addStars+1);addRender()};
$('aTkClr').onclick=()=>{$('aTkTime').value=''};
$('aSave').onclick=async()=>{if(addBusy)return;const m=$('aMsg');m.className='msg';
 const title=$('aTitle').value.trim();if(!title){m.textContent='Add a title';return}
 if(!addWho.length){m.textContent='Pick who it\'s for';return}
 let url,body;if(addKind==='event'){url='api/events/create';body={title:title,date:addDay,allDay:addAllDay,profiles:addWho};
  if(!addAllDay){body.start=$('aStart').value;body.end=$('aEnd').value;if(!body.start||!body.end||body.end<=body.start){m.textContent='End must be after start';return}}}
 else{url='api/chores/create';body={title:title,date:addDay,profiles:addWho,stars:addStars};if($('aTkTime').value)body.time=$('aTkTime').value}
 addBusy=true;$('aSave').disabled=true;m.textContent='Saving…';m.className='msg ok';
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(x){}throw new Error(d||r.status)}
  m.textContent='Added ✓';cache={};load(true);loadChores();setTimeout(addClose,700)}
 catch(err){m.className='msg';m.textContent='Could not save: '+err.message}
 finally{addBusy=false;$('aSave').disabled=false}};

let ovTimer=null,seenRing=undefined;
const camHost=u=>(u||'').replace('{host}',location.hostname);
function openCam(ring){const c=cfg.camera||{};if(!c.url)return;$('ov').classList.add('on');$('pfs').classList.remove('on');
 $('ovlbl').textContent=ring?"Someone's at the front door":(c.name||'Camera');
 if(!$('ovbox').querySelector('iframe')){const f=document.createElement('iframe');f.src=camHost(c.url);f.allow='autoplay; fullscreen';
  f.setAttribute('scrolling','no');f.setAttribute('frameborder','0');f.style.pointerEvents='none';$('ovbox').prepend(f)}
 wake(120000);$('ov').classList.add('on');clearTimeout(ovTimer);ovTimer=setTimeout(closeCam,60000)}
function closeCam(){clearTimeout(ovTimer);$('ov').classList.remove('on');const f=$('ovbox').querySelector('iframe');if(f){f.src='about:blank';f.remove()}}
function setupCamera(){if(location.hash==='#ring')openCam(true)} // demo: /dashboard/#ring (no stream is loaded until a ring)
$('ov').onclick=closeCam;
// no always-on feed: the doorbell is the ring overlay (and the rail camera button); its iframe is created on open and cleared on close
async function pollRing(){try{const d=await getJSON('api/doorbell');
  if(seenRing===undefined)seenRing=d.last_ring;
  else if(d.last_ring&&d.last_ring!==seenRing){seenRing=d.last_ring;openCam(true)}}catch(e){}}
setInterval(pollRing,2000);

let wxDays={};
function dayWx(d){const w=wxDays[d];if(!w)return '';const hl=[w.hi,w.lo].filter(x=>x!==null&&x!==undefined).map(x=>x+'°').join(' / ');return `<span class="dw">${w.icon||''} ${hl}</span>`}
async function weather(){try{const d=await getJSON('api/weather');wxDays={};(d.days||[]).forEach(x=>wxDays[x.date]=x);
  const c=d.current||{},t=wxDays[today()]||{};const hl=(t.hi!=null?'H '+t.hi+'° ':'')+(t.lo!=null?'L '+t.lo+'°':'');
  $('wx').innerHTML=`<span class="ic">${c.icon||'🌡️'}</span><span>${c.temp!=null?c.temp+'°F':'--'}</span>`;$('wx').title=(c.text||'')+' '+hl;render()}
 catch(e){$('wx').innerHTML='<span class="ic">🌡️</span><span>Weather unavailable</span>'}}

async function loadHome(){try{const d=await getJSON('api/home');$('hchips').innerHTML=(d.chips||[]).map(c=>`<span class="hc ${c.level}" title="${esc(c.id)}">${c.icon} ${esc(c.name)} · ${esc(c.label)}</span>`).join('')}catch(e){}}

async function loadChores(){try{chData=await getJSON('api/chores');renderChores();renderMembers()}catch(e){if(!chData)$('kids').innerHTML='<div class="empty">Chores unavailable</div>'}}
function renderChores(){if(!chData)return;const ks=chData.kids||[];
 $('kids').innerHTML=ks.map(k=>`<div class="kid" style="--c:${pc(k)};--t:${TINT[k.name]||TINT.Family}"><div class="kh"><i style="background:${pc(k)}">${ini(k.name)}</i>${esc(k.name)}<span class="st">⭐ ${k.stars}</span></div>`+
  (k.chores.length?k.chores.map(c=>`<button class="cb${c.done?' done':''}${c.tappable?'':' ro'}" data-id="${c.id}" data-ro="${c.tappable?0:1}"><span class="bx">${c.done?'✓':''}</span><span class="tt">${esc(c.title)}</span>${c.stars?`<span class="sv">+${c.stars}⭐</span>`:''}</button>`).join(''):'<div class="empty">No chores today</div>')+'</div>').join('')||'<div class="empty">No chores today</div>'}
$('kids').onclick=async e=>{const b=e.target.closest('.cb');if(!b||chBusy)return;
 if(b.dataset.ro==='1'){$('chmsg').textContent='repeating chore: check off in the eCalendar app';setTimeout(()=>$('chmsg').textContent='tap to check off',5000);return}
 chBusy=true;b.classList.add('busy');
 try{const r=await fetch('api/chores/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:b.dataset.id})});
  if(!r.ok)throw new Error(r.status);const d=await r.json();chData={day:d.day,kids:d.kids};renderChores();renderMembers()}
 catch(err){b.classList.remove('busy');$('chmsg').textContent='could not save ('+err.message+')'}
 finally{chBusy=false}};

// night dim: near-black overlay between cfg.night.start and end (America/Chicago); tap or doorbell wakes for 2 min
let wakeUntil=0;
const toMin=s=>{const a=String(s||'0:0').split(':');return (+a[0])*60+(+a[1]||0)};
let forceNight=false;
function isNight(){if(forceNight)return true;const n=cfg.night||{start:'21:00',end:'06:00'},p=partsInTZ(new Date()),m=(+p.hour)*60+(+p.minute),a=toMin(n.start),b=toMin(n.end);
 if(location.hash==='#night')return true;return a<=b?(m>=a&&m<b):(m>=a||m<b)}
function wake(ms){wakeUntil=Date.now()+(ms||120000);nightTick()}
function nightTick(){const on=isNight()&&Date.now()>wakeUntil&&!$('ov').classList.contains('on');$('night').classList.toggle('on',on);

<!-- ===== KIOSK EXIT HOOK (Android app) - keep when redesigning: hold the clock (#time, or #ntime in night mode) 3s -> window.KioskApp.exit() ===== -->
<script>
(function(){
  var HOLD=3000, C=2*Math.PI*26, t=null, raf=null, start=0, ring=null, sx=0, sy=0;
  function stop(){ if(t){clearTimeout(t);t=null;} if(raf){cancelAnimationFrame(raf);raf=null;} if(ring){ring.parentNode.removeChild(ring);ring=null;} }
  function tick(){ if(!ring) return; var p=Math.min(1,(Date.now()-start)/HOLD); ring.querySelector('circle+circle').setAttribute('stroke-dashoffset',String(C*(1-p))); raf=requestAnimationFrame(tick); }
  function begin(el,x,y){
    if(!(window.KioskApp && window.KioskApp.exit)) return; // normal browser: do nothing
    stop(); sx=x; sy=y; var r=el.getBoundingClientRect();
    ring=document.createElement('div');
    ring.style.cssText='position:fixed;width:60px;height:60px;pointer-events:none;z-index:9999;opacity:.75;left:'+(r.left+r.width/2-30)+'px;top:'+(r.top+r.height/2-30)+'px';
    ring.innerHTML='<svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="4"/><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(128,128,128,.85)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 30 30)" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>';
    document.body.appendChild(ring); start=Date.now(); tick();
    t=setTimeout(function(){ stop(); try{window.KioskApp.exit();}catch(x){} }, HOLD);
  }
  ['time','ntime'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.style.webkitUserSelect='none'; el.style.userSelect='none'; el.style.webkitTouchCallout='none';
    el.addEventListener('touchstart',function(e){var q=e.touches[0];begin(el,q.clientX,q.clientY);},{passive:true});
    el.addEventListener('mousedown',function(e){begin(el,e.clientX,e.clientY);});
    el.addEventListener('touchmove',function(e){var q=e.touches[0]; if(Math.abs(q.clientX-sx)>20||Math.abs(q.clientY-sy)>20) stop();},{passive:true});
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(n){ el.addEventListener(n,stop,{passive:true}); });
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
})();
</script>
<!-- ===== END KIOSK EXIT HOOK ===== -->
